name: dependency risk

on:
  pull_request:

# The repository default is read-only, so the comment permission is requested
# here rather than granted to every workflow.
permissions:
  contents: read
  pull-requests: write

jobs:
  risk:
    runs-on: ubuntu-latest
    # Nothing to say about a pull request a human wrote.
    # The PR author, not github.actor -- the actor is whoever triggered the event,
    # so a maintainer reopening or pushing to a bot's branch would skip the check.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'renovate[bot]'
    steps:
      - uses: DigiCatalyst-Systems/dependabot-risk@b52f928fe6f146f7aa29d5c820d7cd1cc57ece41 # v1.2.1

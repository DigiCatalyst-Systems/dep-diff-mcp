name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Pauses for a human approval before anything reaches npm. A publish cannot
    # be undone after 72 hours, so the tag push alone should not be the last
    # word. The `release` environment also scopes the OIDC token: npm's trusted
    # publisher can be pinned to it, so editing this file cannot route around
    # the gate.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Print npm version
        run: npm --version

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - run: npm publish --access public --provenance

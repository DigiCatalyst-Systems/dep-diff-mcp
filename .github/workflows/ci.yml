name: ci

# Pull requests only. A merge to main is the commit the pull request already
# tested, so running the suite again there spent a run for no new signal. A new
# push to the pull request cancels the run it supersedes. The same checks run
# locally before every push (.githooks/pre-push, scripts/verify.sh).
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # This project tells people what is risky in a dependency upgrade, so its
      # own shipped dependency tree is a hard gate. Dev-only advisories are
      # reported but do not block, since they never reach a consumer.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit
        continue-on-error: true

      - run: npm run build

      - run: npm test
